name: Web CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install, test, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned submodules (retry transient upstream errors)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if git submodule sync --recursive &&
               git -c protocol.version=2 submodule update --init --depth=1 --recursive; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Submodule fetch failed on attempt $attempt; retrying in 15 seconds."
              sleep 15
            fi
          done
          echo "Could not fetch one or more pinned submodules after 3 attempts."
          exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project build checks
        run: pnpm run build
